
<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney Magic Portal</title>
  <link rel="stylesheet" href="menu.css">
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="stars" id="stars"></div>
  <div class="container">
   <header class="header"><img src="https://rawsvg.com/images/high/6k13t6fmwu9ze9n9.png" alt="Disney Logo" class="logo">
   </header>
   <main class="main-content">
    <div class="castle-container"><img src="https://rawsvg.com/images/file/disney-castle-free-iluustration-smnxm8nfm2ejyvqa.svg" alt="Disney Castle" class="castle">
    </div>
    <h1 class="title">EXPLORE YOUR MOVIES</h1>
    <p class="subtitle">Where Dreams Come True</p>
    <div class="character-section"><img src="https://i.pinimg.com/236x/99/5e/3f/995e3f604a7b018a0d0dd135d9dd5ef5.jpg" alt="Disney Character" class="character-image">
     <div class="character-text">
      <h2 class="character-title">Welcome to Disney Magic!</h2>
      <p class="character-description">Step into a world of wonder and imagination. Discover enchanting stories, beloved characters, and magical adventures that will capture your heart.</p>
     </div>
    </div><button class="start-button" id="startButton"> <span>✨ START YOUR JOURNEY ✨</span> </button>
   </main>
  </div>
  <script>
        // Create animated stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const numberOfStars = 50;

            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // Initialize stars when page loads
        createStars();

        // Start button functionality
        document.getElementById('startButton').addEventListener('click', function() {
            // Add a magical click effect
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
            }, 150);

            // You can add navigation logic here
            // For now, it just shows a magical message
            setTimeout(() => {
                this.innerHTML = '<span>🏰 Welcome to Disney Magic! 🏰</span>';
                    setTimeout(() => {
                        // Navigate to login page
                        window.location.href = "login.html";
                    }, 1000);
            }, 200);
        });

        // Add floating animation to elements on scroll
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const castle = document.querySelector('.castle');
            if (castle) {
                castle.style.transform = `translateY(${scrolled * 0.1}px)`;
            }
        });

        // Movies page functionality
        function showMoviesPage() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="movies-page">
                    <header class="movies-header">
                        <img src="https://rawsvg.com/images/high/6k13t6fmwu9ze9n9.png" alt="Disney Logo" class="logo">
                        <button class="back-button" onclick="goBack()">← Back to Home</button>
                    </header>
                    
                    <main class="movies-content">
                        <h1 class="movies-title">🎬 Disney Movies Collection 🎬</h1>
                        <p class="movies-subtitle">Choose your magical adventure</p>
                        
                        <div class="movies-grid">
                            <div class="movie-card" onclick="selectMovie('Frozen')">
                                <div class="movie-poster">❄️</div>
                                <h3>Frozen</h3>
                                <p>Let it go, let it go!</p>
                            </div>
                            
                            <div class="movie-card" onclick="selectMovie('The Lion King')">
                                <div class="movie-poster">🦁</div>
                                <h3>The Lion King</h3>
                                <p>Hakuna Matata!</p>
                            </div>
                            
                            <div class="movie-card" onclick="selectMovie('Beauty and the Beast')">
                                <div class="movie-poster">🌹</div>
                                <h3>Beauty and the Beast</h3>
                                <p>Tale as old as time</p>
                            </div>
                            
                            <div class="movie-card" onclick="selectMovie('Aladdin')">
                                <div class="movie-poster">🧞‍♂️</div>
                                <h3>Aladdin</h3>
                                <p>A whole new world</p>
                            </div>
                            
                            <div class="movie-card" onclick="selectMovie('Moana')">
                                <div class="movie-poster">🌊</div>
                                <h3>Moana</h3>
                                <p>How far I'll go</p>
                            </div>
                            
                            <div class="movie-card" onclick="selectMovie('Tangled')">
                                <div class="movie-poster">👸</div>
                                <h3>Tangled</h3>
                                <p>When will my life begin</p>
                            </div>
                        </div>
                    </main>
                </div>
            `;
            
            // Add movies page styles
            const moviesStyles = `
                .movies-page {
                    min-height: 100%;
                    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #87ceeb 100%);
                }
                
                .movies-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 1rem 2rem;
                    background: rgba(255, 255, 255, 0.1);
                    backdrop-filter: blur(10px);
                }
                
                .back-button {
                    background: rgba(255, 215, 0, 0.9);
                    color: #8B4513;
                    border: none;
                    padding: 0.5rem 1rem;
                    border-radius: 25px;
                    cursor: pointer;
                    font-weight: bold;
                    transition: all 0.3s ease;
                }
                
                .back-button:hover {
                    background: #FFD700;
                    transform: translateY(-2px);
                }
                
                .movies-content {
                    padding: 2rem;
                    text-align: center;
                }
                
                .movies-title {
                    font-size: 2.5rem;
                    color: #FFD700;
                    text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
                    margin-bottom: 1rem;
                    animation: sparkle 2s ease-in-out infinite;
                }
                
                .movies-subtitle {
                    font-size: 1.3rem;
                    color: #E6E6FA;
                    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
                    margin-bottom: 3rem;
                    font-style: italic;
                }
                
                .movies-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                    gap: 2rem;
                    max-width: 1200px;
                    margin: 0 auto;
                }
                
                .movie-card {
                    background: rgba(255, 255, 255, 0.15);
                    backdrop-filter: blur(15px);
                    border: 2px solid rgba(255, 215, 0, 0.3);
                    border-radius: 20px;
                    padding: 2rem;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                }
                
                .movie-card:hover {
                    transform: translateY(-10px);
                    box-shadow: 0 12px 40px rgba(255, 215, 0, 0.4);
                    border-color: rgba(255, 215, 0, 0.6);
                }
                
                .movie-poster {
                    font-size: 4rem;
                    margin-bottom: 1rem;
                    animation: bounce 2s ease-in-out infinite;
                }
                
                .movie-card h3 {
                    color: #FFD700;
                    font-size: 1.5rem;
                    margin-bottom: 0.5rem;
                    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
                }
                
                .movie-card p {
                    color: #E6E6FA;
                    font-style: italic;
                    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
                }
                
                @media (max-width: 768px) {
                    .movies-header {
                        flex-direction: column;
                        gap: 1rem;
                    }
                    
                    .movies-title {
                        font-size: 2rem;
                    }
                    
                    .movies-grid {
                        grid-template-columns: 1fr;
                        gap: 1.5rem;
                    }
                }
            `;
            
            // Add styles to head
            const styleSheet = document.createElement('style');
            styleSheet.textContent = moviesStyles;
            document.head.appendChild(styleSheet);
        }
        
        function goBack() {
            window.location.hash = '';
            location.reload();
        }
        
        function selectMovie(movieName) {
            const movieCards = document.querySelectorAll('.movie-card');
            movieCards.forEach(card => {
                if (card.querySelector('h3').textContent === movieName) {
                    card.style.transform = 'scale(0.95)';
                    card.style.background = 'rgba(255, 215, 0, 0.3)';
                    setTimeout(() => {
                        alert(`🎬 You selected: ${movieName}! 🎬\n\nEnjoy your magical Disney adventure!`);
                        card.style.transform = '';
                        card.style.background = 'rgba(255, 255, 255, 0.15)';
                    }, 200);
                }
            });
        }
    </script>
