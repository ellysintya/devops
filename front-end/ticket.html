
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Ticket - Disney Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="styleSheet" href="ticket.css">
</head>
<body>
  <div class="ticket-header">
    <h2>🎟 Buy Your Disney Ticket</h2>
    <button class="back-button" onclick="history.back()">← Back</button>
  </div>

  <div class="container">
    <div id="poster" class="poster"></div>
    <div class="ticket-info">
      <h1 id="title">Loading...</h1>
      <p><strong>Date:</strong> <span id="date">Saturday, Oct 25 2025</span></p>
      <p><strong>Showtimes:</strong> 13:00 • 16:00 • 19:00 • 21:00</p>

      <form id="ticketForm">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="seats">Number of Tickets:</label>
        <select id="seats">
          <option value="1">1 Ticket</option>
          <option value="2">2 Tickets</option>
          <option value="3">3 Tickets</option>
          <option value="4">4 Tickets</option>
        </select>

        <label for="time">Select Time:</label>
        <select id="time">
          <option>13:00</option>
          <option>16:00</option>
          <option>19:00</option>
          <option>21:00</option>
        </select>

        <button type="submit" class="submit-btn">Confirm Purchase 🎫</button>
      </form>
    </div>
  </div>

  <script>
    // Ambil parameter judul film dari URL
    const params = new URLSearchParams(window.location.search);
    const movieTitle = params.get('title');

    const movieData = {
  "The Nutcracker 2": "https://lumiere-a.akamaihd.net/v1/images/nutcracker-and-the-four-realms-poster_8824b113.jpeg",
  "Little Mermaid": "https://lumiere-a.akamaihd.net/v1/images/poster-id-payoff_ce62087b.jpeg",
  "Encanto": "https://lumiere-a.akamaihd.net/v1/images/encanto-id-poster_b0f0a082.jpeg",
  "Elemental Forces of Nature": "https://lumiere-a.akamaihd.net/v1/images/elemental-poster-id_8425eb19.jpeg",
  "Raya and The Last Dragon": "https://lumiere-a.akamaihd.net/v1/images/character_poster_04_402f583b.jpeg",
  "Leroy & Stitch": "https://lumiere-a.akamaihd.net/v1/images/open-uri20150422-12561-1loqhq0_38866eec.jpeg",
  "Incredibles 2": "https://lumiere-a.akamaihd.net/v1/images/poster-incinemas-now-en_042a3924.jpeg",
  "Aladdin": "https://lumiere-a.akamaihd.net/v1/images/aladdin-movie-poster_63150511.jpeg",
  "Toy Story 4": "https://lumiere-a.akamaihd.net/v1/images/toystory4-poster_6b94390a.jpeg",
  "Avatar: The Way of Water": "https://lumiere-a.akamaihd.net/v1/images/avatar-wayofwater-id_afe7ec94.jpeg?region=0%2C0%2C600%2C900",
  "Turning Red": "https://lumiere-a.akamaihd.net/v1/images/turning-red-dplus-poster-hotstar-id_6e493d5c.jpeg"
};


    if (movieTitle && movieData[movieTitle]) {
      document.getElementById('title').textContent = movieTitle;
      document.getElementById('poster').style.backgroundImage = `url('${movieData[movieTitle]}')`;
    } else {
      document.getElementById('title').textContent = "Movie Not Found";
    }

    // Event konfirmasi pembelian tiket
    document.getElementById('ticketForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const seats = document.getElementById('seats').value;
      const time = document.getElementById('time').value;

      alert(`🎉 Thank you ${name}!\nYou successfully booked ${seats} ticket(s) for "${movieTitle}" at ${time}.`);
      window.location.href = "menu.html"; // kembali ke halaman utama setelah pesan
    });
  </script>
</body>
</html>
