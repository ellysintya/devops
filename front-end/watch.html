<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Film</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
       
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
  <link rel="styleSheet" href="watch.css">
 </head>
<body>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="form-container"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" alt="Disney Logo" class="logo">
   <h1 id="pageTitle">Tambah Film Baru ✨</h1>
   <p id="pageSubtitle" class="subtitle">Lengkapi informasi film untuk ditambahkan ke koleksi</p>
   <form id="movieForm"><label for="movieName">🎬 Nama Film</label> <input type="text" id="movieName" class="input-field" placeholder="Contoh: The Shawshank Redemption" required> <label for="movieYear">📅 Tahun Rilis</label> <input type="number" id="movieYear" class="input-field" placeholder="Contoh: 2024" min="1900" max="2030" required> <label for="movieDesc">📝 Deskripsi</label> <textarea id="movieDesc" class="input-field" placeholder="Ceritakan sinopsis atau deskripsi singkat tentang film..." required></textarea> <label for="posterURL">🖼️ URL Poster</label> <input type="url" id="posterURL" class="input-field" placeholder="https://example.com/poster.jpg" required>
    <div id="posterPreview" class="poster-preview">
     <p>Preview poster akan muncul di sini</p>
    </div><label for="videoURL">🎥 URL Video</label> <input type="url" id="videoURL" class="input-field" placeholder="https://example.com/trailer.mp4" required>
    <div id="videoPreview" class="video-preview">
     <p>Preview video akan muncul di sini</p>
    </div><button type="button" id="submitBtn" class="submit-btn"> <span id="submitButtonText">Tambah Film ke Firestore</span> </button>
    <div id="successMessage" class="message-box success-message">
     ✅ Film berhasil ditambahkan!
    </div>
    <div id="errorMessage" class="message-box error-message">
     ❌ <span id="errorText">Terjadi kesalahan. Silakan coba lagi.</span>
    </div>
   </form>
  </div>
  <script type="module">
        // Import fungsi addMovieToFirestore dari main.js
        import { addMovieToFirestore } from './main.js';
        
        // Simpan fungsi ke window agar bisa diakses dari script biasa
        window.addMovieToFirestore = addMovieToFirestore;
    </script>
  <script>
        const defaultConfig = {
            page_title: "Tambah Film Baru ✨",
            page_subtitle: "Lengkapi informasi film untuk ditambahkan ke koleksi",
            submit_button_text: "Tambah Film ke Firestore"
        };

        async function onConfigChange(config) {
            document.getElementById('pageTitle').textContent = config.page_title || defaultConfig.page_title;
            document.getElementById('pageSubtitle').textContent = config.page_subtitle || defaultConfig.page_subtitle;
            document.getElementById('submitButtonText').textContent = config.submit_button_text || defaultConfig.submit_button_text;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["page_title", config.page_title || defaultConfig.page_title],
                ["page_subtitle", config.page_subtitle || defaultConfig.page_subtitle],
                ["submit_button_text", config.submit_button_text || defaultConfig.submit_button_text]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }

        // Poster preview functionality
        const posterInput = document.getElementById('posterURL');
        const posterPreview = document.getElementById('posterPreview');

        posterInput.addEventListener('input', function() {
            const url = this.value.trim();
            if (url) {
                posterPreview.innerHTML = `<img src="${url}" alt="Poster Preview" onerror="this.src=''; this.style.display='none'; this.parentElement.innerHTML='<p>Gagal memuat poster. Periksa URL.</p>';">`;
                posterPreview.classList.add('has-image');
            } else {
                posterPreview.innerHTML = '<p>Preview poster akan muncul di sini</p>';
                posterPreview.classList.remove('has-image');
            }
        });

        // Video preview functionality
        const videoInput = document.getElementById('videoURL');
        const videoPreview = document.getElementById('videoPreview');

        videoInput.addEventListener('input', function() {
            const url = this.value.trim();
            if (url) {
                videoPreview.innerHTML = `<video controls onerror="this.style.display='none'; this.parentElement.innerHTML='<p>Gagal memuat video. Periksa URL.</p>';"><source src="${url}" type="video/mp4">Browser Anda tidak mendukung tag video.</video>`;
                videoPreview.classList.add('has-video');
            } else {
                videoPreview.innerHTML = '<p>Preview video akan muncul di sini</p>';
                videoPreview.classList.remove('has-video');
            }
        });

        
        document.getElementById('submitBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            
            const form = document.getElementById('movieForm');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            
            successMsg.classList.remove('show');
            errorMsg.classList.remove('show');
            
            if (form.checkValidity()) {
                // Disable button during submission
                this.disabled = true;
                this.innerHTML = '<span>⏳ Mengirim ke Firestore...</span>';
                
                // Ambil data dari form
                const movieName = document.getElementById('movieName').value;
                const movieYear = parseInt(document.getElementById('movieYear').value);
                const movieDesc = document.getElementById('movieDesc').value;
                const posterUrl = document.getElementById('posterURL').value;
                const videoUrl = document.getElementById('videoURL').value;
                
                try {
                    // Panggil fungsi Firestore
                    if (typeof window.addMovieToFirestore === 'function') {
                        const docId = await window.addMovieToFirestore(
                            movieName, 
                            movieYear, 
                            movieDesc, 
                            posterUrl, 
                            videoUrl
                        );
                        
                        // Show success message
                        successMsg.innerHTML = `✅ Film berhasil ditambahkan ke Firestore! (ID: ${docId})`;
                        successMsg.classList.add('show');
                        
                        // Reset form after 2 seconds
                        setTimeout(() => {
                            form.reset();
                            posterPreview.innerHTML = '<p>Preview poster akan muncul di sini</p>';
                            posterPreview.classList.remove('has-image');
                            videoPreview.innerHTML = '<p>Preview video akan muncul di sini</p>';
                            videoPreview.classList.remove('has-video');
                            successMsg.classList.remove('show');
                        }, 3000);
                    } else {
                        throw new Error('Fungsi Firestore tidak ditemukan. Pastikan main.js sudah di-load.');
                    }
                } catch (error) {
                    // Show error message
                    errorMsg.classList.add('show');
                    document.getElementById('errorText').textContent = error.message || 'Gagal menyimpan ke Firestore. Cek koneksi dan konfigurasi.';
                } finally {
                    // Re-enable button
                    this.disabled = false;
                    this.innerHTML = `<span>${window.elementSdk?.config?.submit_button_text || defaultConfig.submit_button_text}</span>`;
                }
            } else {
                form.reportValidity();
            }
        });
    </script>
